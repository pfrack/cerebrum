name: AI Code Review

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: AI Code Review
        uses: pfrack/review-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          custom_models: ${{ secrets.CUSTOM_MODELS }}
          custom_models_base_url: ${{ secrets.CUSTOM_MODELS_BASE_URL }}
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          kilocode_api_key: ${{ secrets.KILO_API_KEY }}
          nousresearch_api_key: ${{ secrets.NOUSRESEARCH_API_KEY }}
          nim_api_key: ${{ secrets.NIM_API_KEY }}
          mistral_api_key: ${{ secrets.MISTRAL_API_KEY }}
          custom_swe_score: ${{ secrets.CUSTOM_SWE_SCORE }}
          custom_api_url: ${{ secrets.CUSTOM_API_URL }}
          custom_api_key: ${{ secrets.CUSTOM_API_KEY }}
